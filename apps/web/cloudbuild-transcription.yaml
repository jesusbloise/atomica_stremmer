steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.transcription"
      - "-t"
      - "us-central1-docker.pkg.dev/atomica-stremmer-prod/cloud-run-source-deploy/atomica-transcription:latest"
      - "."

images:
  - "us-central1-docker.pkg.dev/atomica-stremmer-prod/cloud-run-source-deploy/atomica-transcription:latest"

options:
  machineType: "E2_HIGHCPU_8"
